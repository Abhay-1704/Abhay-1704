name: Update GitHub Contribution Animation

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Generate base SVG
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        cd scripts
        python svgmaker3.py
        
    - name: Animate SVG
      run: |
        cd scripts
        python animate7.py
        
    - name: Move files to root
      run: |
        mv scripts/brickbreaker.svg ./ || true
        mv scripts/brickbreaker_with_paddle_looping.svg ./ || true
        
    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add brickbreaker.svg brickbreaker_with_paddle_looping.svg || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "🎮 Update contribution animation [skip ci]" && git push)
